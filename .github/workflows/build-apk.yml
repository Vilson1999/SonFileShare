name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up JDK (Java Development Kit)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Grant execution permission to Gradle wrapper
      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      # 5. Build Debug APK (ARMv7 & ARMv8)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Upload the generated APK as a GitHub artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonShare-arm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
